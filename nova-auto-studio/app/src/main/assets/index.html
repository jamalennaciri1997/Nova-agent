<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA Auto Studio</title><style>body{font:16px system-ui;background:#10131b;color:white;padding:20px}section{background:#222a3b;padding:16px;margin:14px 0;border-radius:16px}input,select,button{display:block;width:100%;padding:12px;margin:10px 0;box-sizing:border-box}button{background:#4169ef;color:white;border:0;border-radius:8px}</style><h1>NOVA Auto Studio</h1><p>نسخة اختبار Android: اختيار الملفات وخطة مونتاج فقط.</p><section><input id="media" type="file" accept="image/*,video/*,audio/*" multiple><p id="names"></p></section><section><select id="ratio"><option>9:16</option><option>16:9</option><option>1:1</option></select><select id="template"><option>Fast Beat</option><option>Cinematic</option><option>Light Effects</option></select><button onclick="plan()">إنشاء خطة المونتاج</button><div id="result"></div></section><p>ملاحظة: تصدير MP4 والمونتاج الفعلي لم يُنفذا بعد.</p><script>let files=[];document.getElementById("media").onchange=e=>{files=Array.from(e.target.files);document.getElementById("names").textContent=files.map(x=>x.name).join(" • ")};function plan(){document.getElementById("result").textContent=files.length?files.map((x,i)=>(i+1)+". "+x.name).join(" | "):"اختار الملفات أولا"}</script></html>
